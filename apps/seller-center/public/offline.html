<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f0" />
    <title>Hors ligne · Espace vendeur atlas dz</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf8f0;
        color: #253b2c;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        padding: 24px;
        max-width: 420px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 22px;
        margin: 18px 0 8px;
      }
      p {
        color: #626f60;
        line-height: 1.5;
        margin: 0 0 6px;
      }
      section + section {
        margin-top: 22px;
      }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 13px 22px;
        border-radius: 8px;
        background: #294a34;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="atlas dz" />
      <section>
        <h1>Vous êtes hors ligne</h1>
        <p>Vos commandes et produits s’afficheront dès que la connexion reviendra.</p>
      </section>
      <section lang="ar" dir="rtl">
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>ستظهر طلباتك ومنتجاتك فور عودة الاتصال.</p>
      </section>
      <a href="">Réessayer · إعادة المحاولة</a>
    </main>
  </body>
</html>
